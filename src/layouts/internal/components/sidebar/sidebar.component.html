<nav class="sidebar__nav">
  <div class="sidebar__top">
    <button class="sidebar__item sidebar__toggle" type="button" aria-label="Toggle menu">
      <ui-kit-icon name="menu-open" [size]="20" />
    </button>
  </div>

  <div class="sidebar__links">
    <a
      class="sidebar__item"
      routerLink="/categories"
      routerLinkActive="sidebar__item--active"
      aria-label="Categories"
    >
      <ui-kit-icon name="settings" [size]="20" />
    </a>
  </div>

  <div class="sidebar__bottom">
    <button class="sidebar__item" type="button" aria-label="Account">
      <ui-kit-icon name="account-circle" [size]="20" />
    </button>

    <button class="sidebar__item" type="button" aria-label="Logout" (click)="onLogout()">
      <ui-kit-icon name="logout" [size]="20" />
    </button>
  </div>
</nav>
