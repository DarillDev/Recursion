<div class="header">
  <h1 class="title">Categories</h1>
  @if (canEdit()) {
    <ui-kit-button variant="primary" (click)="onAdd()">+ Add</ui-kit-button>
  }
</div>

<ui-kit-search-input
  class="search"
  placeholder="Search"
  [formControl]="searchControl"
/>

<app-category-table
  class="table"
  [items]="items()"
  [isLoading]="isLoading()"
  [sort]="sort()"
  [canEdit]="canEdit()"
  [hasMore]="hasMore()"
  (sortToggle)="onSortToggle($event)"
  (edit)="onEdit($event)"
  (delete)="onDelete($event)"
  (loadMore)="onLoadMore()"
/>
