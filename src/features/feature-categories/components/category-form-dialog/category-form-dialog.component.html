<ui-kit-modal-container [title]="title">
  <form class="category-form-dialog__form" [formGroup]="form" (ngSubmit)="onSubmit()">
    <ui-kit-input-field label="Name" formControlName="name" />

    <div footer class="category-form-dialog__footer">
      <ui-kit-button type="button" variant="secondary" data-testid="cancel-btn" (click)="cancel()">
        Close
      </ui-kit-button>
      <ui-kit-button type="submit" [disabled]="isSaveDisabled()" data-testid="save-btn">Save</ui-kit-button>
    </div>
  </form>
</ui-kit-modal-container>
