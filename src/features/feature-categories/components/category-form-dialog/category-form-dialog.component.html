<ui-kit-modal-container [title]="title">
  <form class="form" [formGroup]="form" (ngSubmit)="onSubmit()">
    @if (isEditMode) {
      <ui-kit-input-field label="ID" [formControl]="idControl" />
    }
    <ui-kit-input-field label="Name" formControlName="name" />

    <div footer class="footer">
      <ui-kit-button
        type="button"
        variant="secondary"
        [disabled]="isSubmitting()"
        data-testid="cancel-btn"
        (click)="cancel()"
      >
        Close
      </ui-kit-button>

      @if (!data || data.canEdit) {
        <ui-kit-button type="submit" [disabled]="isSaveDisabled()" data-testid="save-btn"
          >Save</ui-kit-button
        >
      }
    </div>
  </form>
</ui-kit-modal-container>
