<div class="modal-container">
  <div class="header">
    <h2 class="title">{{ title() }}</h2>
    <button class="close" type="button" (click)="close()">
      <ui-kit-icon name="close" [size]="16" />
    </button>
  </div>

  <div class="body">
    <ng-content />
  </div>

  <div class="footer">
    <ng-content select="[footer]" />
  </div>
</div>
