<ng-content select="ui-kit-label, [uiKitLabel]" />

<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<div
  class="wrapper"
  [class.wrapper--disabled]="isDisabled()"
  [class.wrapper--error]="hasError()"
  (click)="onWrapperClick($event)"
>
  @if (hasPrefix()) {
    <div class="prefix">
      <ng-content select="ui-kit-prefix, [uiKitPrefix]" />
    </div>
  }

  <ng-content />

  @if (hasSuffix()) {
    <div class="suffix">
      <ng-content select="ui-kit-suffix, [uiKitSuffix]" />
    </div>
  }
</div>

@if (hasError() || hasHint()) {
  <div class="hint" [class.hint--error]="hasError()">
    @if (hasError()) {
      <ng-content select="ui-kit-error, [uiKitError]" />
    } @else {
      <ng-content select="ui-kit-hint, [uiKitHint]" />
    }
  </div>
}
